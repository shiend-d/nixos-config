palette = "noctalia"
# Print a new line at the start of the prompt
add_newline = true
# Pipes ╰─ ╭─
# Powerline symbols                                    
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
[╭─](fg:yellow)$cmd_duration $directory$git_branch$fill$character
[╰─](fg:yellow) """

[fill]
symbol = '-'
style = 'fg:yellow'

[character]
success_symbol = "[](bold fg:green)[  ](black bold bg:green)[](bold fg:green)"
error_symbol = "[](bold fg:red)[  ](black bold bg:red)[](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:blue fg:black"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:blue)[$symbol $branch(:$remote_branch)](fg:black bg:blue)[](bold fg:blue)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:blue bold fg:black)[](bold fg:blue)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:magenta fg:black"
style_root = "red bold"
format = "[](bold fg:magenta)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:green fg:black"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:green)[󰉋 → $path]($style)[](bold fg:green)'


[directory.substitutions]
"nixos-config" = "  NixOS "
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Games" = "  "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "
"git_stuff" = "  stuff"
"git" = "  "
"backup" = " 󰁯 "
"python-stuff" = "  stuff"

[cmd_duration]
min_time = 0
format = '[](bold fg:yellow)[󰪢 $duration](bold bg:yellow fg:black)[](bold fg:yellow)'

